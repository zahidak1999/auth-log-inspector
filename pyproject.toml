[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-log-analyzer"
version = "1.0.0"
description = "A small offline analyzer for SSH authentication logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zahid Andre Kristiansen" }]
dependencies = []

[project.scripts]
auth-log-analyzer = "authlog_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
